{% extends 'base.html' %}
{% block content %}
<h1>Fleet</h1>

<!-- Add Truck -->
<div class="section">
    <h2>Add Truck</h2>
    <form action="/fleet/add" method="POST">
        <select name="truckType" required>
            <option value="Gas">Gas</option>
            <option value="Freight">Freight</option>
        </select>
        <input type="number" name="loadingBayNo" placeholder="Loading Bay No (1-5)" min="1" max="5" required>
        <button type="submit">Add Truck</button>
    </form>
</div>

<!-- Fleet Table -->
<div class="section">
    <h2>All Trucks</h2>
    <table>
        <tr>
            <th>Vehicle ID</th>
            <th>Truck Type</th>
            <th>Available</th>
            <th>Loading Bay</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        {% for truck in fleet %}
        <tr>
            <td>{{ truck.vehicleID }}</td>
            <td>{{ truck.truckType }}</td>
            <td>{{ "Yes" if truck.available else "No" }}</td>
            <td>{{ truck.loadingBayNo }}</td>
            <td>
                <form action="/fleet/edit/{{ truck.vehicleID }}" method="POST" style="display:inline">
                    <select name="available">
                        <option value="1" {% if truck.available %}selected{% endif %}>Available</option>
                        <option value="0" {% if not truck.available %}selected{% endif %}>Unavailable</option>
                    </select>
                    <button type="submit">Save</button>
                </form>
            </td>
            <td>
                <a href="/fleet/delete/{{ truck.vehicleID }}">
                    <button class="delete-btn">Delete</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
