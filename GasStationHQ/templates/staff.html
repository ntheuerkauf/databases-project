{% extends 'base.html' %}
{% block content %}
<h1>Staff</h1>

<!-- Add Staff -->
<div class="section">
    <h2>Add Staff</h2>
    <form action="/staff/add" method="POST">
        <input type="number" name="staffID" placeholder="Staff ID" required>
        <input type="text" name="staffFirstName" placeholder="First Name" required>
        <input type="text" name="staffLastName" placeholder="Last Name" required>
        <select name="staffRole" required>
            <option value="Manager">Manager</option>
            <option value="HQ Associate">HQ Associate</option>
            <option value="Driver">Driver</option>
        </select>
        <button type="submit">Add Staff</button>
    </form>
</div>

<!-- Staff Table -->
<div class="section">
    <h2>All Staff</h2>
    <table>
        <tr>
            <th>Staff ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Role</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        {% for member in staff %}
        <tr>
            <td>{{ member.staffID }}</td>
            <td>{{ member.staffFirstName }}</td>
            <td>{{ member.staffLastName }}</td>
            <td>{{ member.staffRole }}</td>
            <td>
                <form action="/staff/edit/{{ member.staffID }}" method="POST" style="display:inline">
                    <select name="staffRole">
                        <option value="Manager" {% if member.staffRole == 'Manager' %}selected{% endif %}>Manager</option>
                        <option value="HQ Associate" {% if member.staffRole == 'HQ Associate' %}selected{% endif %}>HQ Associate</option>
                        <option value="Driver" {% if member.staffRole == 'Driver' %}selected{% endif %}>Driver</option>
                    </select>
                    <button type="submit">Save</button>
                </form>
            </td>
            <td>
                <a href="/staff/delete/{{ member.staffID }}">
                    <button class="delete-btn">Delete</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
